<!doctype html>
<html>
	<head>
		<title>PomMagic Option</title>
        <meta charset="GB2312"/>
        <style type="text/css">
            #sidebar {
                padding: 0;
                margin: 0;
                font-size: 12px;
                width: -webkit-fill-available;
                top: 60px;
                left: 0;
                border-bottom: 1px solid #2d343d;
                background: #EAEDF1;
                display: -webkit-box;
                display: -ms-flexbox;
                display: flex;
                -webkit-box-orient: vertical;
                -webkit-box-direction: normal;
                -ms-flex-direction: column;
                flex-direction: column;
                z-index: 8;
                box-shadow: 0 0 0 rgba(0,0,0,.5);
                width: 400px;
            }
            .info{
                margin: 5px;
                padding: 5px;
            }
            #sidebarItem .info img {
                margin-bottom: 10px;
                overflow: hidden;
                border-radius: 100px;
            }
            #sidebarItem .info span {
                padding: 15px;
            }
        </style>
	</head>
	<body>
		<div id="sidebar">
            <div id="sidebarItem">
                
                <h3>Author Info</h3>
                <div class="info">
                    <div style="float: left;">
                        <img src="images/Earth.gif" height="60" width="60">
                    </div>
                    <div>
                        <span style="font-weight: 700;">Zhansan</span><br><br>
                        <span>aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa</span><br>
                        <span>bbbbbbbbbbbb</span><br>
                        <span>ccccccccccccccccccccccccccccccccccccc</span><br>
                    </div>
                </div>
                
                <br/>
                <div class="info" style="clear:both">
                    <div style="float: left;">
                        <img src="images/Earth.gif" height="60" width="60">
                    </div>
                    <div>
                        <span style="font-weight: 700;">Lishi</span><br><br>
                        <span>eeeeeeeeeeeeeeeeeeeeeeee</span><br>
                        <span>fffffffffffffffffffffff</span><br>
                        <span>ggggggggggggggggggggggggggggggggggg</span><br>
                    </div>
                </div>
            </div>
        </div>
	</body>

</html>
