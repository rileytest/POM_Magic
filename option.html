<!doctype html>
<html>
	<head>
		<title>PomMagic Option</title>
        <meta charset="GB2312"/>
        <style type="text/css">
            #sidebar {
                padding: 0;
                margin: 0;
                font-size: 12px;
                width: -webkit-fill-available;
                top: 60px;
                left: 0;
/*                border-bottom: 1px solid #2d343d;*/
/*                height: calc(100vh - 60px);*/
                background: #EAEDF1;
                display: -webkit-box;
                display: -ms-flexbox;
                display: flex;
                -webkit-box-orient: vertical;
                -webkit-box-direction: normal;
                -ms-flex-direction: column;
                flex-direction: column;
                z-index: 8;
                box-shadow: 0 0 0 rgba(0,0,0,.5);
            }
            .info{
                margin: 5px;
                padding: 5px;
            }
        </style>
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/bootstrap-table.min.css">
        <link rel="stylesheet" href="css/style.css">
        <script src="scripts/jquery-2.1.0.js"></script>
        <script src="scripts/utils.js"></script>
        <script src="scripts/option.js"></script>
        <script src="scripts/popper.js"></script>
        <script src="scripts/bootstrap.min.js"></script>
        <script src="scripts/bootstrap-table.min.js"></script>
	</head>
	<body>
		<div id="sidebar">

            <h3>Option Info:</h3>
            <hr>
            <div class="info">
                <label>Manual Mapping Object Type:</label>
                <input type="text" id="objecttype" value="" size="70" />
                <br/><br/>
                <input type="button" id="save" value="save" />
                <br/>
            </div>
            
            <div class="info">
                <div>
                    <label>Customise Mapping Object Type:</label>
                    <span><button id="objecttypeTable-add" type="button" class="btn btn-success btn-rounded btn-sm my-0">Add</button></span>
                    <span><button id="objecttypeTable-save" type="button" class="btn btn-success btn-rounded btn-sm my-0">Save</button></span>
                    <div>
                        <div id="table">
                            <table id="objecttypeTable" class="table table-bordered table-striped table-responsive-md text-center">
                                <tr>
                                    <th class="text-center">ObjectType</th>
                                    <th class="text-center"><span style="color: red;">*</span>Tag</th>
                                    <th class="text-center">Type</th>
                                    <th class="text-center">Class</th>
                                    <th class="text-center">AttributeName</th>
                                    <th class="text-center">AttributeValue</th>
                                    <th class="text-center">Remove</th>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>

	</body>

</html>
